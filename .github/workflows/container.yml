name: Snyk Container Demo — Image Vulnerability Scan

# ─────────────────────────────────────────
# TRIGGERS
# ─────────────────────────────────────────
on:
  push:
    branches: [main]
    paths:
      - "Dockerfile*"
      - "docker/**"
      - "src/**"          # trigger when app code changes too
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 8 * * *"  # daily at 08:00 UTC — catch new CVEs against existing image
  workflow_dispatch:

# ── Shared env vars ───────────────────────
env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ─────────────────────────────────────────
  # JOB 1: BUILD + QUICK GATE (PR use case)
  # Fails fast on high/critical — blocks merging bad images
  # ─────────────────────────────────────────
  container-quick-gate:
    name: "Container Scan — PR gate (high+)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .

      - name: Run Snyk Container scan — quick gate
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          # Attach Dockerfile so Snyk can detect vulnerable base image
          # and give upgrade recommendations
          args: >-
            --file=Dockerfile
            --severity-threshold=high
            --org=${{ secrets.SNYK_ORG_ID }}
            --project-name=demo-container-pr

  # ─────────────────────────────────────────
  # JOB 2: FULL SCAN — all severities, layered output
  # Demonstrates: exclude-base-image, app-vulns, platform, SARIF
  # ─────────────────────────────────────────
  container-full-scan:
    name: "Container Scan — Full (all severities)"
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .

      - name: Setup Snyk
        uses: snyk/actions/setup@master

      - name: Authenticate Snyk
        run: snyk auth ${{ secrets.SNYK_TOKEN }}

      # ── SCAN A: OS + App vulns, all layers ───────────────────────────────
      # Default: app-vulns ON (CLI ≥ 1.1090.0)
      # Shows full picture: base image issues + user layer + app dependencies
      - name: "Scan A — All layers (OS + App vulns)"
        run: |
          snyk container test ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            --file=Dockerfile \
            --severity-threshold=low \
            --org=${{ secrets.SNYK_ORG_ID }} \
            --project-name=demo-container-all-layers \
            --json-file-output=scan-all-layers.json \
            --sarif-file-output=snyk-container-all.sarif
        continue-on-error: true

      # ── SCAN B: User-layer only (exclude base image vulns) ───────────────
      # KEY OPTION: --exclude-base-image-vulns
      # Only shows vulns YOUR team introduced (not inherited from base image)
      # Useful to focus remediation on what devs control
      - name: "Scan B — User layer only (--exclude-base-image-vulns)"
        run: |
          snyk container test ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            --file=Dockerfile \
            --exclude-base-image-vulns \
            --severity-threshold=medium \
            --org=${{ secrets.SNYK_ORG_ID }} \
            --project-name=demo-container-user-layer \
            --json-file-output=scan-user-layer.json
        continue-on-error: true

      # ── SCAN C: OS vulns only (exclude app scanning) ─────────────────────
      # --exclude-app-vulns: skips scanning app manifest files (package.json etc.)
      # Use case: deduplicate when you already run snyk test for app scanning
      - name: "Scan C — OS vulns only (--exclude-app-vulns)"
        run: |
          snyk container test ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            --file=Dockerfile \
            --exclude-app-vulns \
            --severity-threshold=high \
            --org=${{ secrets.SNYK_ORG_ID }} \
            --project-name=demo-container-os-only
        continue-on-error: true

      # ── SCAN D: Multi-platform (ARM64) ────────────────────────────────────
      # --platform: explicitly target a specific architecture
      # Critical if you ship multi-arch images (AMD64 ≠ ARM64 vuln profile)
      - name: "Scan D — ARM64 platform targeting"
        run: |
          snyk container test ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            --platform=linux/arm64 \
            --file=Dockerfile \
            --severity-threshold=high \
            --org=${{ secrets.SNYK_ORG_ID }} \
            --project-name=demo-container-arm64
        continue-on-error: true


  # ─────────────────────────────────────────
  # JOB 3: MONITOR (continuous tracking)
  # Pushes a snapshot to Snyk for ongoing daily monitoring
  # New CVEs found against your image — Snyk alerts you
  # ─────────────────────────────────────────
  container-monitor:
    name: "Container Monitor — push snapshot to Snyk"
    runs-on: ubuntu-latest
    needs: container-full-scan
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .

      - name: Setup Snyk
        uses: snyk/actions/setup@master

      - name: Authenticate Snyk
        run: snyk auth ${{ secrets.SNYK_TOKEN }}

      # snyk container monitor: records the image in Snyk UI
      # Snyk will re-check daily and alert on new CVEs — no pipeline re-run needed
      - name: "Monitor — register image for ongoing monitoring"
        run: |
          snyk container monitor ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            --file=Dockerfile \
            --org=${{ secrets.SNYK_ORG_ID }} \
            --project-name=demo-container-monitored-${{ github.sha }}
