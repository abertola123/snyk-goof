name: Snyk Container

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  snyk-container:
    name: Scan image for vulnerabilities
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t snyk-goof:${{ github.sha }} .

      # Fail the build on high+ severity vulnerabilities.
      # --file=Dockerfile lets Snyk identify the base image (node:6-stretch)
      # and suggest a safer alternative in the Snyk UI.
      # continue-on-error: true means we still run the monitor step even when
      # issues are found, so results always reach the Snyk UI.
      - name: Snyk container test
        uses: snyk/actions/docker@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: snyk-goof:${{ github.sha }}
          args: >-
            --file=Dockerfile
            --severity-threshold=high
            --org=${{ secrets.SNYK_ORG_ID }}

      # Send a monitored snapshot to the Snyk UI.
      # This creates/updates the project and enables daily re-checks for new CVEs.
      - name: Snyk container monitor
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: monitor
          image: snyk-goof:${{ github.sha }}
          args: >-
            --file=Dockerfile
            --org=${{ secrets.SNYK_ORG_ID }}
            --project-name=snyk-goof-container
